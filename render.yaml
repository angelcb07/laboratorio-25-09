services:
  - type: web
    name: mi-web-auth
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: ATENCION_ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atencion-postgres
          property: connectionString
databases:
  - name: atencion-postgres
    databaseName: atencion_db_7bgm
    user: atencion_owner
